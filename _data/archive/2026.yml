- time_start: '10:00'
  time_end: '10:55'
  track: Tech - Blue
  room: Tech - Blue
  title: 'Finding Evil Fast: Windows Memory Triage with Volatility 3'
  speakers:
  - name: Andrew Case
    company: Volexity
    title: Director of Research, Volexity
  description: 'Memory analysis is an essential investigative technique for detecting modern, memory-resident malware. Unfortunately,
    it is often perceived as a difficult and manual process requiring expert knowledge of operating systems and malware internals.
    This talk challenges that assumption by presenting five checks that can be automatically performed against Windows memory
    samples to quickly surface signs of malicious code execution or attacker access.  The presented checks answer five critical
    triage questions: 1) are any processes running with unexpected privileges, 2)  are restricted resources being accessed
    by unexpected processes, 3) are any processes executing code in a suspicious manner, 4) has malware entered the kernel,
    and 5) does any process or kernel driver match known threat intelligence? All checks will be demonstrated using Volatility
    3, the most widely used open source framework for memory analysis. Attendees will leave with a compact workflow that SOC
    analysts, threat hunters, and incident handlers can use to automatically identify memory-only malware, toolkits, and attacker
    activity, helping them rapidly prioritize systems during large-scale triage and decide where deeper forensic analysis
    is warranted.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '10:00'
  time_end: '10:25'
  track: Tech - Other
  room: Tech - Other
  title: Rethinking CI/CD Security in the Age of GitHub Actions
  speakers:
  - name: Kennedy Toomey
    company: Datadog
    title: Application Security Researcher & Advocate @ Datadog
  - name: Max Saltonstall
    company: null
    title: Technical Storytelling Advocate
  description: 'GitHub Actions can be scary. Growing exponentially, they have quietly become one of the most privileged execution
    environments in modern software delivery, and thus emerged as a major vector. They run on every commit, with access to
    secrets, cloud credentials, and deployment pipelines, yet many teams still treat them as harmless automations.


    In several recent high-impact npm compromises, GitHub Actions were part of the attack surface as workflows were used to
    gain initial access and exfiltrate data. These incidents reveal a broader issue: Github actions are underestimated. These
    systems are deeply trusted, highly privileged, and often poorly secured.


    This talk will break down common abuse patterns, explain why popular defensive advice falls short, and examine how third-party
    actions function as a largely unexamined dependency layer. You''ll leave with practical ways to harden GitHub Actions,
    spot risky patterns, and keep your automation from becoming someone else''s automation.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '10:00'
  time_end: '10:55'
  track: Tech - Red
  room: Tech - Red
  title: Breaking Hybrid Boundaries Across Azure and Windows
  speakers:
  - name: Miryam Adjiashvili Shdema
    company: null
    title: Security Research Team Lead
  - name: Nadav Felman
    company: null
    title: Security Researcher
  description: 'Hybrid environments link on-premises systems with Azure cloud services, creating shared management and trust
    layers that organizations often assume secure by design. Our research shows how this assumption hides critical exposure
    across Microsoft hybrid components.

    During assessments of Windows Admin Center and Azure Arc agent services, we uncovered five zero-day vulnerabilities that
    chain into full kill chains reaching from the local OS to the Azure tenant, including cross-tenant compromise.

    The issues include a cryptographic flaw enabling unauthenticated cross-tenant influence, a local privilege escalation
    in WAC, token verification weaknesses allowing identity and authorization bypass, a chain of client and server-side validation
    flaws enabling RCE and AD compromise, and a race condition in Azure Arc that lets a low-privileged user hijack cloud identity
    and escalate to SYSTEM. These findings span two core Microsoft hybrid platforms and reveal how management services operating
    across host, cloud, and browser layers create pathways across boundaries normally isolated.

    This presentation shows how attackers progress from unauthenticated external or low-privileged internal positions to full
    administrative control of both environments. Viewed through the lens of trust design, credential handling, and service
    initialization logic, the research exposes architectural blind spots common to hybrid platforms.

    These findings earned $31,000 in bounty from Microsoft across five CVEs.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
