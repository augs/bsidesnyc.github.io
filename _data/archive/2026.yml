  track: Tech - Red
  room: Tech - Red
  title: 'When Malware Analysis Leaks Passwords: What Shared Samples Reveal'
  speakers:
  - name: Jonathan Fuller
    company: US Military Academy
    title: CISO @ US Military Academy
  description: 'Security teams are often advised not to upload suspicious files directly to public malware-analysis platforms
    like VirusTotal, but to avoid tipping off adversaries. While this reflects a well-understood risk, it overlooks another
    exposure that receives far less attention.


    In this talk, we demonstrate how common binary analysis techniques, combining static inspection with targeted symbolic
    execution, can recover authentication material embedded in executables, scripts, and configuration artifacts. These techniques
    are routinely used to analyze malware; here, we apply them to identify and extract credential-bearing API calls across
    a range of samples.


    We present several case studies showing how credentials such as FTP logins can be recovered directly from binaries, often
    revealing internal systems and access patterns. In each case, the credentials are not intentionally exposed, but are embedded
    as part of normal application behavior and become accessible through standard analysis workflows.


    We then examine how samples circulating through shared analysis ecosystems can be monitored and mined for this information,
    and how recovered credentials can be operationalized.


    Attendees will leave with a clear understanding of how credential material appears in binaries, how it can be extracted
    in practice, and why publicly shared analysis environments may expose more than intended.'
