  title: The Cyber-IQ Test for LLMs
  speakers:
  - name: Hadar Waldman
    company: Artemis
    title: Leads security research and a part of the founding team of Artemis, the world’s first AI-Native detection and response
      platform
  - name: Sharan Sankar
    company: Artemis
    title: Founding Engineer of Artemis, the world’s first AI-Native detection and response platform
  description: 'If you have wired an LLM into a security workflow, you have seen this: the model produces a confident sentence
    about a log, and it is wrong in a way the analyst cannot catch from the log itself. The model said the user logged in
    three times. It was one login. That is not a reasoning failure, it is a knowledge failure — and no prompt engineering
    fixes a thing the model simply does not know.


    So we measured it. From a production AI-native SOC we extracted 1,973 atomic pieces of per-source tribal knowledge — the
    field names that lie, the batching artifacts, the empty-but-required fields — turned the 30 hardest into a 74-question
    test backed by real sanitized production logs, and ran it against nine frontier models from three providers. The results
    are not what the pricing pages imply: eight of nine cluster inside a 1.4-point band, the cheap tiers tie the frontier
    tiers, and one question is answered wrong by all nine, with the identical wrong answer. That blind spot breaks every model-driven
    Okta investigation flow shipping today, including probably yours. You will vote on real bench questions before I show
    what the models picked.'
