  video_url: null
  recorded: null
- time_start: '16:30'
  time_end: '16:55'
  track: Tech - Other
  room: Tech - Other
  title: 'AI Threats: Defender Reality Check'
  speakers:
  - name: Hadar Waldman
    company: Artemis
    title: Leads security research and a part of the founding team of Artemis, the world’s first AI-Native detection and response
      platform
  description: 'Since late 2024, every major vendor has published the same prediction for how AI agents would change the threat
    landscape: self-adapting malware, deepfake-driven collapse, a 100x explosion in exploitation. It''s the end of 2026. Some
    of it happened. But as an incident responder who has worked with dozens of organizations on hundreds of attacks this past
    year, I don''t think most of those predictions came to pass in any way that changed how we actually practice detection
    and response. Plenty has changed. It just wasn''t on anyone''s list.


    This is a practitioner-to-practitioner breakdown of what genuinely shifted for defenders since coding agents became commodity
    tooling, and what is still marketing. I''ll take the five areas the predictions covered- phishing, social engineering,
    CVE volume, supply chain, malware- put real numbers and real detection experience against each, and grade them: escalated,
    overhyped, or mis-framed. Then the one that nobody put on a slide on 2024.'
