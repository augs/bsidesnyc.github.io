- time_start: '13:00'
  time_end: '13:55'
  track: Entrepreneur
  room: Entrepreneur
  title: Building a Cybersecurity Company That Survives — The Hard Parts Nobody Tells You
  speakers:
  - name: Joshua Crumbaugh
    company: PhishFirewall
    title: CEO of PhishFirewall
  description: 'Starting a cybersecurity company sounds simple on paper: find a problem, build a solution, sell it. In reality,
    founders run into a much harder set of challenges — identifying a painful enough problem, proving the market cares, getting
    early customers to trust you, and building something that survives long enough to matter.


    This talk is a practical founder''s view of what it actually takes to start a cybersecurity company and get it moving.
    We''ll cover the hardest parts of the journey: choosing the right problem, validating demand, turning technical ideas
    into a product people buy, navigating long sales cycles, earning credibility in a crowded market, and avoiding the common
    mistakes that kill security startups early.


    Attendees will leave with:

    1. a clearer framework for choosing a cybersecurity problem worth building around,

    2. a realistic view of the early-stage startup traps that slow founders down,

    3. and concrete lessons on how to build momentum, trust, and traction in a difficult market.


    This is not a theory talk. It''s a founder-level look at what it actually takes to turn a cybersecurity idea into a company.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '13:00'
  time_end: '13:25'
  track: Tech - Blue
  room: Tech - Blue
  title: 'Stop the LLM Flip-Flop: Hardening Your AI SOC Agent Against the Gray Zone'
  speakers:
  - name: Diane Lin
    company: Datadog
    title: Datadog, AI SOC tech lead
  description: 'Run the same task twice through the same LLM model, and sometimes you get two semantically different answers.
    This is not a quirk; it is a vulnerability.


    In this session, we reveal that LLM flip-flops are not random noise. They cluster precisely near the decision boundary,
    the "gray zone", the same region that adversarial machine learning has exploited for years. RL-based malware evasion tools
    probe this boundary to slip past classifiers. Modern LLM jailbreaks (GCG and its variants) use gradient-based search to
    push the model''s internal state across the alignment boundary. The fuzziness that makes your SOC agent inconsistent is
    the exact same fuzziness that attackers weaponize.


    We present a lightweight, memory-augmented architecture that attacks this problem from both ends. Drawing on the cognitive
    science distinction between episodic and semantic memory, we show how to equip AI agents with two complementary defenses:
    episodic memory and semantic memory. Together, they sharpen the decision boundary without the cost or opacity of fine-tuning.


    The results are concrete: verdict flip-flops drop by over 60%. The residual ambiguous cases are automatically surfaced
    for focused human review,  turning a liability into a calibration mechanism. Attendees will leave with a practical, deployable
    workflow for making their AI agents more consistent, more trustworthy, and significantly harder to manipulate.'
