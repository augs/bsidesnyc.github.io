- time_start: '12:00'
  time_end: '12:25'
  track: Tech - Other
  room: Tech - Other
  title: 'Cleartext at the Edge: A Neptune R900 Case Study in RF Telemetry Exposure'
  speakers:
  - name: Rick Ramirez
    company: null
    title: Product security engineer and former Marine Corps radio/electronics technician researching RF telemetry exposure,
      OT/ICS security, and cyber-physical privacy risk
  description: 'Security teams are trained to think in terms of networks, endpoints, cloud systems, identity, and applications.
    But many cyber-physical systems communicate through a layer that often sits outside traditional security visibility: radio
    frequency.

    This talk presents a passive RF case study of Neptune R900 water meter telemetry and the broader security implications
    of cleartext AMR communications. Using low-cost software-defined radio tooling and receive-only observation, the research
    examines how wireless meter telemetry can expose structured data such as meter identifiers, consumption readings, status
    indicators, timestamps, and signal metadata before that data ever reaches utility-controlled systems.


    The presentation walks through the RF security model, the AMR data flow from meter endpoint to utility systems, and the
    privacy risks created when repeated cleartext telemetry becomes pattern-of-life data. It also maps the findings to a qualitative
    risk model focused on likelihood, impact, and cyber-physical context. The discussion includes responsible research boundaries,
    disclosure considerations, and recommendations for utilities, vendors, and security teams.


    Attendees will leave with a practical understanding of why RF telemetry should be treated as part of the attack surface,
    why legacy AMR design assumptions create modern privacy and trust-boundary risks, and how procurement, threat modeling,
    and architecture reviews can better account for signal-layer exposure.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '12:00'
  time_end: '12:25'
  track: Tech - Red
  room: Tech - Red
  title: Browser-Based Port Scanning in the Age of LNA
  speakers:
  - name: Gev Manekshaw
    company: null
    title: Principal Security Engineer
  description: 'Modern browsers are adding Local Network Access controls to prevent public websites from silently interacting
    with localhost and private-network services. But introducing a new security boundary also creates new browser behavior
    and new opportunities for unintended exposure.


    This talk presents independent research into an unexpected side channel in the browser’s handling of local-network requests.
    From the context of a web page, it is possible to infer details about services reachable by a user’s browser without reading
    their responses or obtaining local-network permission.


    Browser-based port scanning has historically been used for fingerprinting and tracking, helping websites infer which applications
    or services may be running on a device. Because the browser can reach both public and local network resources, this technique
    has important privacy and security implications.


    I will explain how the behavior was discovered, how it was tested, and how it became a working proof of concept. The session
    will also cover the practical limits of the technique and what it reveals about security checks that occur before a permission
    decision is made.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '12:00'
  time_end: '12:55'
  track: Workshop
  room: Workshop
  title: DIY Continuous Security Engineering
  speakers:
  - name: Mark El-Khoury
    company: Movable Ink
    title: Director, Security Engineering @ Movable Ink
  - name: Omar S
    company: Betterment
    title: Staff Security Engineer, Betterment
  description: 'There’s no shortage of acronyms being invented every week in the realm of security engineering. Instead of
    wading through these buzzwords that might not even be around by the end of the year, we’ll dig into the principles that
    we think make for a good security program. We’ll then apply these principles with practical hands-on exercises where we’ll
    use free and open source security tools to build continuous security automation and alerting similar to ones we’ve built
    when starting new security programs.


    We want this workshop to be a hands-on exercise in building a good security program. We’ve built security programs from
    scratch at multiple companies and have found that while the companies can vary, the fundamentals remain roughly the same.
    We want to bridge the gap between common infosec vendor jargon and practical security engineering work.'
