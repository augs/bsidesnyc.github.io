- time_start: '11:00'
  time_end: '11:55'
  track: Tech - Red
  room: Tech - Red
  title: 'Authorization phishing: phishing, but without the creds'
  speakers:
  - name: Luke Jennings
    company: Push Security
    title: VP, R&D, Push Security
  description: 'Credential phishing used to be simple: trick a victim into typing their password into a fake login page, then
    reuse it. Then MFA meant a password alone wasn''t enough. Attackers responded with real-time proxies to steal valid sessions
    via Attacker-in-the-Middle (AITM) phishing. Then we deployed passkeys, the "unphishable" factor, and attackers responded
    with MFA downgrade attacks against vulnerable backup methods.


    But what if attackers could convince targets to grant account access without ever touching their credentials, where MFA
    and passkeys don''t matter because the login isn''t the target at all?


    Authorization phishing is a growing class of attack abusing OAuth authorization flows rather than authentication. The
    umbrella includes consent phishing, device code phishing, and ConsentFix.

    These are being mass adopted as authentication controls mature and passkey adoption accelerates, giving attackers a technical
    and human advantage in unfamiliar phishing scenarios. Device code phishing has exploded from tiny volumes to a tier-1
    threat in early 2026, while ConsentFix was newly discovered in late 2025 after a Russia-linked campaign.


    This talk covers the history that led us here, technical details and demos of every attack, in-the-wild examples, and
    practical guidance on how organizations can prevent and detect them.'
  type: talk
