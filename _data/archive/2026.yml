- time_start: '17:30'
  time_end: '17:55'
  track: Tech - Blue
  room: Tech - Blue
  title: 'Thinking Outside the Package: Hunting Supply Chain Behavior from the Endpoint Perspective'
  speakers:
  - name: Bar Matalon
    company: Palo Alto Networks
    title: Threat Intelligence Team Lead @ Palo Alto Networks
  - name: Noa Dekel
    company: Palo Alto Networks
    title: Senior Threat Intelligence Researcher, Palo Alto Networks
  description: 'For years, software supply chain security in npm and PyPI was treated as a "developer problem." But since
    2025, the threat landscape has escalated. We are no longer fighting simple credential stealers - we face massive campaigns
    of destructive malware and self-replicating worms.

    This shift is amplified by AI-assisted "vibe coding." As more users implement code they don''t fully understand, attackers
    weaponize AI to compromise packages and hallucinate malicious ones at scale.

    In this session, we analyze the anatomy of these modern compromises. We strip away the abstraction: when users run npm
    install or pip install, they aren''t just downloading files. They are executing a process tree with full user privileges.

    We will demonstrate why endpoint visibility is the missing link in defense. By the time a registry removes a malicious
    package, it''s too late: the code has already executed. We will expose the attacker’s playbook, dissecting notable campaigns
    to reveal their tradecraft. You will see every step of the kill chain mapped out, from the initial install command to
    malicious child processes and network beacons.

    Attendees will leave with practical hunting tips and specific query logic, empowering defenders to detect anomalies and
    stop compromised supply chains before they spread.'
  type: talk
