  title: You're Qilin Me! Dissecting Qilin's 2026 Attack on TWU Local 100
  speakers:
  - name: Antoine Valadon
    company: University of Arizona
    title: Threat Intelligence & Applied Physics-Informed ML Researcher | University of Arizona
  description: 'Qilin, a ransomware-as-a-service gang, didn''t just claim to hit TWU Local 100 in February 2026. That''s the
    union behind the people running NYC''s subways and buses. Qilin dumped 700,000 files. That''s 551GB. The union confirmed
    it. SSNs, medical records, pension files, disciplinary history. All of it, in the wrong hands.


    This talk skips the generic recap. It goes straight to how. We''ll dissect one real Qilin intrusion, start to finish.
    An MSP used a remote-access tool. Attackers phished it with a fake login page. The page stole a password. It also stole
    a live MFA code. That turned into ransomware across every one of that MSP''s customers. It happened overnight. Then we''ll
    show the same failure mode in a second, faster case.


    You''ll leave knowing exactly what to hunt for in your own environment. And you''ll know why unions, associations, and
    anyone with a small security team and a big membership list are exactly what this organization frequently targets.'
