  video_url: null
  recorded: null
- time_start: '12:30'
  time_end: '12:55'
  track: Tech - Other
  room: Tech - Other
  title: 'It Costs More to Make Than It’s Worth: Lessons from the Penny for Your Sentinel Deployment'
  speakers:
  - name: Mona Ghadiri
    company: null
    title: VP of CIS - Security Operations, Microsoft Security MVP | SIEM & XDR and Security Copilot
  description: 'The US penny was retired because it cost more to produce than its face value. A lot of Sentinel deployments
    have the same problem…data flowing into the wrong tier, connectors nobody is monitoring, and ingestion costs that don’t
    map to actual detection value. The difference is nobody retired the bad design.


    This session connects three things most Sentinel engineers are treating as separate problems: ingestion visibility, tier
    architecture, and DCR design. We’ll use the new Data Insights Connector Observability preview as the diagnostic lens.
    A centralized dashboard that finally surfaces what’s flowing where, which connectors own which tables, and where ingestion
    anomalies are silently eroding your coverage is within reach.


    From there we go deeper: how multi-destination DCRs let you deliberately split data streams at ingestion, routing high-fidelity
    events to Analytics for real-time detection while offloading lower-value telemetry to the data lake tier without losing
    it. And critically why that architectural decision only works if your observability is in place first.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '12:30'
  time_end: '12:55'
  track: Tech - Red
  room: Tech - Red
  title: 'Deep Link Vulnerabilities: When One Click Leads to Account Takeover'
  speakers:
  - name: Sai Jagadeesh
    company: null
    title: Staff Security Engineer
  description: 'Deep links are widely used in mobile applications to provide seamless navigation to specific screens inside
    an app. However, when deep links are improperly validated, they can become powerful attack vectors that allow external
    inputs to directly influence internal application behavior.


    This lightning talk explores how seemingly harmless deep links can lead to serious security issues such as token leakage,
    WebView exploitation, and even one-click account takeover.


    In one example, a crafted deep link forces the app to open an attacker-controlled URL inside a WebView while automatically
    appending the victim’s authentication token, allowing the attacker to hijack the account with a single click.


    We will also look at how vulnerable WebView configurations combined with exported deep link activities can enable attackers
    to exfiltrate session cookies, load malicious content, or execute privileged actions inside the app context.


    This talk highlights common developer mistakes, demonstrates how attackers chain deep link handling with WebView behavior,
    and provides practical mitigation strategies to secure mobile applications against these hidden entry points.'
  type: talk
