  track: Entrepreneur
  room: Entrepreneur
  title: LLM Generated Code Works. It's Also Vulnerable.
  speakers:
  - name: Nick Shrimankar
    company: Immersivle, Inc
    title: Immersivle, Inc, Founder
  description: 'LLM-generated code has a dangerous quality: it works. It runs, it passes the quick eyeball test, and that''s
    exactly the problem; because working and secure are not the same thing. This talk is about the new review skill nobody
    trained us for: spotting and hardening the vulnerabilities in code a machine wrote before it reaches production.

    When a human writes a risky line, another human usually catches it in review. That safety net has held for decades. But
    AI generates code so fast and so fluently that the net now has holes in it, and most teams haven''t noticed.

    Here''s the trap. LLM-generated code looks finished. It reads clean, it compiles, it runs. So reviewers relax because
    polish feels like proof. But fluent isn''t the same as safe, and the very confidence that makes AI code pleasant to read
    is what makes it slip past us.

    I''ll walk through four areas: where machine-generated code quietly breaks trust boundaries, the classes of vulnerability
    that show up most often and why they hide so well, what a sane review process looks like when a real share of your commits
    had a non-human co-author, and how to build the habits so this scales. Think of it like onboarding a brilliant new hire
    who writes beautiful code and has zero memory of your security policies. You don''t stop the hire. You build the habits
    that catch what they miss.

    You''ll leave able to spot the failure patterns, ask the right questions and put guardrails in place before AI code ships
    rather than after it breaks.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '16:00'
  time_end: '16:55'
  track: Tech - Blue
  room: Tech - Blue
  title: 'Verified Lies: Hunting Identity Fraud Infrastructure Behind Fake Verification Flows'
  speakers:
  - name: Andre Piazza
    company: BforeAI
    title: Cybersecurity Strategist at BforeAI
  description: 'Verification exists to answer one question: is this real? Increasingly, attackers do not answer it, they impersonate
    the question itself, cloning the login flow and staging a check that was never checking anything. I show how to hunt the
    cloned portal from public signals and pivot from one to the whole campaign.


    The lens is financial services, where verification language is a staging tell across lookalike finance domains you can
    surface yourself from certificate transparency and public newly-registered-domain feeds, before the fraud those pages
    carry. I walk two cases my team investigated: a cloned US Department of Education G5 grant portal that staged a fake /verify/
    step to harvest credentials, timed to agency disruption, and a UK retail scam riding the DragonForce intrusions that weaponized
    identity checks and reused infrastructure across brands. In both, the catchable signal lived in the infrastructure, not
    a vulnerability.


    I then show how you run the same checks with free public tools: certificate transparency, WHOIS / RDAP and ASN, and page
    tells like reused language, favicon, and script, mapped to ATT&CK so hunting a clone becomes a detection you keep. I close
    with a live read of a staged credential-harvesting page, pivoting to siblings live when they share a favicon, script,
    or certificate. You will leave able to tell verification bypass from impersonation, spot a staged portal and pivot to
    its siblings from public signals, and rerun the whole hunt on free tools.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '16:00'
  time_end: '16:25'
  track: Tech - Other
  room: Tech - Other
  title: 'The 40-Hour Hunt Problem: Where AI Actually Saves Time (and Where It Doesn''t)'
  speakers:
  - name: Nivea Sharma
    company: SpaceXAI
    title: Security Engineer @ SpaceXAI | Building detections, investigating incidents, measuring what matters
  - name: Neha Gautam
    company: Microsoft
    title: Product Manager | Microsoft Security & Identity
  description: 'Every AI-SOC vendor has a number that sounds too good to ignore - investigations that used to take hours now
    finish in minutes, workloads cut by 80%. But nobody actually measures where hunt time goes in the first place. A real
    proactive hunt isn''t just writing a query - it''s forming a hypothesis, pivoting across tools, reading thousands of events,
    validating findings, and documenting what matters. That process can easily take 40+ hours, which is exactly why most SOCs
    can''t hunt as often as they''d like.

    This talk answers the question directly. We ran the same credential-abuse hunt twice - hunting anomalous sign-ins and
    token replay for signs of account compromise - once manually, once with AI copilots, using the same lab environment, dataset,
    and starting hypothesis both times, timing every phase. We''ll walk through exactly where AI saved real hours, where it
    helped us think faster, and where it confidently produced wrong leads that took longer to verify than they were worth.
    To show the pattern holds, we''ll close with a comparison against two more hunt types, plus a lightweight framework attendees
    can use to test AI-hunting claims themselves.

    This isn''t a vendor demo or a promise that AI fixes SOC burnout - it''s a measured, honest look at where AI actually
    helps and where it doesn''t. No vendor, no product, no pitch - just a stopwatch, a real hunt, and the number nobody''s
    bothered to measure.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '16:00'
  time_end: '16:55'
  track: Tech - Red
  room: Tech - Red
  title: 'Weirder Machines: Compositional Attack Surfaces at the LLM-Tool Boundary'
  speakers:
  - name: Ariel Fogel
    company: Pillar Security
    title: AI Security Researcher @ Office of the CTO, Pillar Security
  - name: Eilon Cohen
    company: Pillar Security
    title: Head of Security Research @ Pillar Security
  description: 'The agentic-AI security debate has stalled on prompt injection. In this talk we argue that this emphasis has
    us watching the wrong boundary.

    We begin by walking through three patched cases: Cursor, Google''s Antigravity IDE, and RTK (a small CLI proxy). In Cursor''s
    strictest mode (CVE-2026-22708, CVSS 9.8), an empty allowlist and exempt shell built-ins produced zero-click code execution,
    while Antigravity''s Secure Mode kept all three of its promises even as a planted repo comment launched code. RTK involved
    no prompt injection at all: following filter rules an attacker committed to the repo, it silently stripped the backdoor
    lines from the output, so the model reasoned correctly over a filtered view and approved code it never fully saw.

    The through-line is a structural bug class we call the weirder machine, where a stochastic component upstream of a deterministic
    boundary makes its unmodeled instruction set searchable, as it did in a CVSS 10.0 RCE in Google''s Gemini CLI. Sometimes
    the model is steered, and other times it serves only as the laundering stage. We argue that the class forces a rethink
    of common defenses: output sanitizing and injection detection both fail, and the fix is to invert control policy at the
    tool boundary by allowing on argument shape, tracking config provenance, making enforcement mode-aware, and isolating
    execution. We put forward the OWASP''s new Agent Control Standard as a way to standardize the wire contract those controls
    require.'
  type: talk
  slides_url: null
  video_url: null
  recorded: null
- time_start: '16:30'
  time_end: '16:55'
  track: Entrepreneur
  room: Entrepreneur
  title: 'The Accidental Leader: An Engineer''s Path to Startups and Conferences'
  speakers:
  - name: Chris Maenner
    company: BSidesPhilly
    title: BSidesPhilly Organizer
  description: 'In 2006, I was an engineer who just wanted to solve hard technical problems. I never planned to run security
    teams, lead startups, or help build conferences. But somewhere along the way, the path forked—and I kept saying yes.


    This talk is the story of that journey: from individual contributor to Head of Security, from attendee to BSides board
    member, from employee to startup operator. It''s about the moments that forced me to grow, the mistakes I made along the
    way, and what I wish someone had told me earlier.


    We''ll cover:

    - When to stay technical vs. when to step into leadership

    - What running a startup actually looks like (spoiler: less glamorous than Instagram suggests)

    - How building conferences changed how I think about community and career

    - The skills that transferred and the ones I had to learn from scratch


    This isn''t a talk about frameworks or methodologies. It''s an honest conversation about building things that matter companies,
    teams, and communities.'
  type: talk
