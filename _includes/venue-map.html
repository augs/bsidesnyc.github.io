<!-- Venue Maps Section -->
<section id="venue-maps">
    <div class="content-wrapper">
        <div class="row">
            <div class="col-lg-8 offset-lg-2 col-12">
                <h3>Maps</h3>
                <p>{{ site.venueMapsIntro }}</p>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                {% include venue-overview.html %}
            </div>
        </div>

        {% for map in site.venueFloorMaps %}
        <div class="row venue-map-heading" id="{{ map.divId }}">
            <div class="col-lg-10 offset-lg-1 col-12">
                <h4>{{ map.name }}</h4>
                <a href="{{ site.baseurl }}/img/venue/{{ map.image }}" target="_blank" rel="noopener">
                    <img class="animated venue-map" data-animation="fadeIn" src="{{ site.baseurl }}/img/venue/{{ map.image }}" alt="{{ map.name }} floor plan" width="1200" height="550" loading="lazy">
                </a>
            </div>
        </div>
        {% endfor %}

    </div>
</section>
<!-- End Venue Maps Section -->
