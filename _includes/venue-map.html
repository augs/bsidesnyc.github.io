<!-- Venue Maps Section -->
<section id="venue-maps">
    <div class="content-wrapper">
        <div class="row">
            <div class="col-lg-8 offset-lg-2 col-12">
                <h3>Maps</h3>
                <p>{{ site.venueMapsIntro }}</p>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                {% include venue-overview.html %}
            </div>
        </div>

        {% for map in site.venueFloorMaps %}
        <div class="row venue-map-heading" id="{{ map.divId }}">
            <div class="col-lg-10 offset-lg-1 col-12">
                <h4>{{ map.name }}</h4>
                <figure class="floorplan">
                    <div class="fp-scroll">
                        <svg class="fp" viewBox="0 0 1200 560" role="group" aria-label="{{ map.name }} plan">
                            <text class="fp-street" x="600" y="32">59th Street</text>
                            <text class="fp-street" x="600" y="536">58th Street</text>
                            <text class="fp-street" x="30" y="285" transform="rotate(-90 30 285)">11th Avenue</text>
                            <g class="fp-compass" transform="translate(96 30)"><path d="M0 -16 L8 12 L0 7 L-8 12 Z"/><text x="20" y="0">N</text></g>
                            <rect class="fp-bldg" x="60" y="60" width="1110" height="450" rx="14"/>
                            {% include floorplans/{{ map.svg }} %}
                            <rect class="fp-outline" x="60" y="60" width="1110" height="450" rx="14"/>
                        </svg>
                    </div>
                    <figcaption>
                        <span class="fp-hint">Swipe sideways for the whole floor &rarr;</span>
                        Not to scale. <a href="{{ site.baseurl }}/img/venue/{{ map.image }}" target="_blank" rel="noopener">Full architectural plan</a>
                    </figcaption>
                </figure>
            </div>
        </div>
        {% endfor %}

    </div>
</section>
<!-- End Venue Maps Section -->
